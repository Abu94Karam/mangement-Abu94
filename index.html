﻿<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر العدد الصناعية</title>
<meta name="description" content="متجر عدد وأدوات صناعية — بيع وصيانة">
<link rel="manifest" href="manifest.json">
 <link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f2b705">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2326;--steel:#e4e7e9;--panel:#fff;--sun:#f2b705;--rust:#b8442b;--ok:#2e7d4f;--mut:#6a7177;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ink:#eef0f1;--steel:#181b1d;--panel:#23272b;--mut:#9aa2a8;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--steel);color:var(--ink)}
header{background:#1f2326;color:#fff;border-bottom:6px solid var(--sun);padding:22px 16px}
header h1{margin:0;font-size:1.7rem;font-weight:800}header p{margin:4px 0 0;color:#c4c9cc}
main{max-width:1100px;margin:auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea,button{font:inherit;padding:9px 11px;border:1.5px solid #9aa2a8;border-radius:4px;background:var(--panel);color:var(--ink)}
input,select,textarea{width:100%}.bar input{flex:2 1 160px}.bar select{flex:1 1 120px}
button{cursor:pointer;background:var(--sun);color:#1f2326;border-color:#1f2326;font-weight:600}
button.g{background:transparent;color:var(--ink)}button.d{background:var(--rust);color:#fff;border-color:var(--rust)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1.5px solid #1f2326;border-radius:2px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:#c9cdd0;display:block}
.card div{padding:11px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{margin:0;font-size:1.05rem}
.price{font-weight:800;font-size:1.25rem}.tag{font-size:.8rem;color:var(--mut)}.out{color:var(--rust);font-weight:600}.in{color:var(--ok);font-weight:600}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:22px 0}
.box{background:var(--panel);border-right:6px solid var(--sun);padding:12px 14px;white-space:pre-line}.box b{display:block;margin-bottom:4px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:12px;z-index:9}.modal.on{display:flex}
.modal>form,.modal>div{background:var(--panel);width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:16px;border-radius:4px;display:grid;gap:9px}
.modal h2{margin:0}label{font-size:.88rem;color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button.on{background:#1f2326;color:#fff}
table{width:100%;border-collapse:collapse;background:var(--panel);font-size:.9rem}th,td{padding:8px;border-bottom:1px solid #9aa2a855;text-align:right;vertical-align:top}
.wrap{overflow-x:auto}.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi div{background:var(--panel);padding:12px;border-top:5px solid var(--sun)}.kpi b{font-size:1.5rem;display:block}
footer{text-align:center;padding:24px;color:var(--mut)}footer button{font-size:.8rem;padding:4px 10px}
.hide{display:none!important}.row{display:flex;gap:6px;flex-wrap:wrap}

.hero{background:#1f2326 repeating-linear-gradient(135deg,#ffffff08 0 2px,transparent 2px 14px);padding:34px 16px 0;border-bottom:6px solid var(--sun)}
.hero>div{max-width:1100px;margin:auto}.hero h1{font-size:2.3rem;line-height:1.2}.hero p{font-size:1.05rem;max-width:560px}
.hero .row{margin:16px 0 22px}.hero .g{color:#fff;border-color:#fff}
.stat{display:flex;gap:0;flex-wrap:wrap;border-top:1px solid #ffffff30}.stat span{padding:12px 20px 12px 0;margin-left:20px;color:#c4c9cc}.stat b{color:var(--sun);font-size:1.3rem;margin-left:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;background:var(--panel);color:var(--ink);border:1.5px solid #1f2326;border-radius:999px}.chip small{opacity:.65}
.chip.on{background:#1f2326;color:#fff;border-color:#1f2326}
.imgb{position:relative;padding:0;border:0;border-radius:0;background:none;display:block;width:100%}
span.ph{display:block}.bd{position:absolute;top:8px;right:8px;background:var(--sun);color:#1f2326;padding:2px 9px;font-size:.78rem;font-weight:800;border-radius:2px}.bd.r{background:var(--rust);color:#fff}
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#1f2326;color:#fff;border-right:8px solid var(--sun);padding:18px 20px;margin:26px 0 0}
.svc b{display:block;font-size:1.2rem}.svc span{color:#c4c9cc}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;background:var(--panel);border:1.5px dashed #9aa2a8}
.det img{width:100%;max-height:300px;object-fit:contain;background:#c9cdd0}
#fc{position:fixed;bottom:16px;left:16px;z-index:8;padding:12px 18px;box-shadow:0 4px 14px #0006;font-size:1rem}
#ts{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#1f2326;color:#fff;padding:9px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}#ts.on{opacity:1}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #9aa2a855;padding:6px 0}
#ft{margin-bottom:22px}#ft h2{border-right:6px solid var(--sun);padding-right:10px;margin:0 0 10px}
.hero{background-size:cover;background-position:center;min-height:300px;display:flex;align-items:flex-end}
.hero>div{width:100%}
.hero h1{margin:0}.hero h1,.hero p{text-shadow:0 2px 8px #000a}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.brand img{width:76px;height:76px;border-radius:16px;border:3px solid var(--sun);object-fit:cover;background:#000;flex:none}
.hero{background-image:linear-gradient(rgba(31,35,38,.55),rgba(31,35,38,.92)),url(cover.jpg)}
</style>
</head>
<body>
<header class="hero"><div><div class="brand"><img src="icon-192.png" alt="شعار المتجر"><h1 id="sn">متجر العدد الصناعية</h1></div><p id="sd">عدد وأدوات صناعية — بيع وإصلاح</p>
 <div class="row"><button onclick="document.getElementById('q').scrollIntoView({behavior:'smooth',block:'center'})">تصفح المنتجات</button><button class="g" onclick="openRepair()">طلب إصلاح عدة</button></div>
 <div class="stat" id="stat"></div></div></header>
<main>
<section id="ft" class="hide"><h2>منتجات مميزة</h2><div id="fg" class="grid"></div></section>
<div class="bar">
 <input id="q" placeholder="ابحث عن عدة أو أداة…" aria-label="بحث">
 <select id="sort" aria-label="الترتيب"><option value="av">المتوفر أولاً</option><option value="lo">الأرخص</option><option value="hi">الأغلى</option></select>
<select id="brand" aria-label="الماركة"><option value="">كل الماركات</option></select></div>
<div id="chips" class="chips"></div><p class="tag" id="cnt"></p>
<div id="grid" class="grid"></div>
<section class="svc"><div><b>عندك عدة تحتاج إصلاحاً؟</b><span>أرسل وصف العطل وصورة، وسنرد عليك بالتكلفة والموعد.</span></div><button onclick="openRepair()">اطلب إصلاحاً</button></section><div id="pol"></div>
<section class="box" style="margin-top:22px"><b>تتبع طلبك</b><div class="row"><input id="tc" placeholder="أدخل رقم الطلب" dir="ltr" style="flex:1"><button onclick="track()">تتبع</button></div><div id="tr"></div></section>
<div class="info"><div class="box"><b>طرق الدفع</b><span id="pay">—</span></div><div class="box"><b>التوصيل</b><span id="del">—</span></div><div class="box"><b>تواصل معنا</b><span id="ct">—</span></div></div>

<section id="adm" class="hide">
 <h2>لوحة الإدارة</h2>
 <div class="tabs" id="tabs"></div>
 <div id="tab"></div>
</section>
</main>
<footer>© <span id="yr"></span> <button class="g" id="lg" onclick="loginOpen()">دخول الإدارة</button></footer>

<div class="modal" id="mdm"><div id="md" class="det"></div></div>
<button id="fc" class="hide" onclick="openCart()">🛒 السلة (<b id="fn">0</b>)</button><div id="ts" role="status"></div>
<!-- order -->
<div class="modal" id="mo"><form id="fo"><h2>سلة الطلب</h2><div id="ol"></div>
 <label>الاسم</label><input id="oc" required><label>الهاتف</label><input id="op" type="tel" required>
 <label>الاستلام</label><select id="od"><option>استلام من موقع الاستلام</option><option>توصيل</option></select>
 <select id="oz" class="hide"></select> <label>العنوان (للتوصيل)</label><input id="oa"><label>طريقة الدفع</label><select id="opay"></select>
 <div class="row"><input id="cp" placeholder="كود الخصم" style="flex:1"><button type="button" class="g" onclick="applyCp()">تطبيق</button></div> <div id="ot"></div><div class="row"><button>إرسال الطلب</button><button type="button" class="g" onclick="cl('mo')">إلغاء</button></div></form></div>
<!-- repair -->
<div class="modal" id="mr"><form id="fr"><h2>طلب إصلاح</h2>
 <label>الاسم</label><input id="rc" required><label>الهاتف</label><input id="rp" type="tel" required>
 <label>اسم العدة / نوعها</label><input id="rt" required><label>وصف العطل</label><textarea id="rd" rows="3" required></textarea>
 <label>صورة (اختياري)</label><input id="ri" type="file" accept="image/*">
 <div class="row"><button>إرسال الطلب</button><button type="button" class="g" onclick="cl('mr')">إلغاء</button></div></form></div>
<!-- login -->
<div class="modal" id="ml"><form id="fl"><h2>دخول الإدارة</h2>
 <label>كلمة السر</label><input id="lp" type="password" autocomplete="current-password" required>
 <div id="le" class="out"></div><div class="row"><button>دخول</button><button type="button" class="g" onclick="cl('ml')">إلغاء</button></div></form></div>
<div class="modal" id="mb"><form id="fb"><h2>توريد بضاعة</h2><label>المنتج</label><select id="bp"></select>
 <label>الكمية المستلمة</label><input id="bq" type="number" min="1" required><label>سعر التكلفة للقطعة</label><input id="bc" type="number" step="0.01" min="0" required>
 <label>المورّد / ملاحظة</label><input id="bs"><div class="row"><button>حفظ التوريد</button><button type="button" class="g" onclick="cl('mb')">إلغاء</button></div></form></div>
<!-- product -->
<div class="modal" id="mp"><form id="fp"><h2 id="pt">منتج</h2>
 <label>الاسم</label><input id="pn" required><label>التصنيف</label><input id="pc" list="cl" required><datalist id="cl"></datalist>
 <label>السعر</label><input id="pr" type="number" step="0.01" min="0" required><label>الكمية بالمخزون</label><input id="ps" type="number" min="0" required>
 <label>سعر التكلفة (للإدارة فقط)</label><input id="pco" type="number" step="0.01" min="0"><label>حد تنبيه المخزون (اختياري)</label><input id="pl" type="number" min="0">
 <label>الوصف</label><textarea id="pd" rows="2"></textarea>
 <label>الصور (حتى 4، الأولى هي الغلاف)</label><input id="pi" type="file" accept="image/*" multiple><div id="pv" class="row"></div>
<label>الماركة</label><input id="pb"><label>السعر قبل الخصم (اختياري، يظهر كعرض)</label><input id="po" type="number" step="0.01" min="0">
<label>المواصفات (سطر لكل خاصية، مثل: القدرة: 800 واط)</label><textarea id="psp" rows="3"></textarea>
<label><input type="checkbox" id="ph" style="width:auto"> إخفاء المنتج مؤقتاً</label>
 <label><input type="checkbox" id="pf" style="width:auto"> منتج مميز (يظهر في أعلى المتجر)</label>
 <div class="row"><button>حفظ</button><button type="button" class="g" onclick="cl('mp')">إلغاء</button></div></form></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,getDoc,arrayUnion,addDoc,setDoc,updateDoc,deleteDoc,increment,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; import {initializeAppCheck,ReCaptchaV3Provider} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js"; 

/* ====== عدّل هذه القيم فقط ====== */
const firebaseConfig={apiKey:"AIzaSyDKCJsNN4OrH0AlpWDN_CDjLTFsXk5M1EI",authDomain:"store-manger-8e0e4.firebaseapp.com",projectId:"store-manger-8e0e4",appId:"1:521051505984:web:63dfb7552c4260897da6a5"};
const ADMIN_EMAIL="espresso.t2t@gmail.com"; // نفس البريد الذي تنشئه في Authentication
const CUR="د.أ"; // العملة
/* =============================== */

const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
/* initializeAppCheck(app,{provider:new ReCaptchaV3Provider("مفتاح_الموقع"),isTokenAutoRefreshEnabled:true}); */const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const m=n=>(+n||0).toLocaleString("ar",{maximumFractionDigits:2})+" "+CUR;
let P=[],PR=[],BL={},CP=null,O=[],R=[],S={},CO={},OC={},MV=[],EX=[],PER="all",admin=false,tab="products",editId=null,img="",imgs=[],unsubs=[];
window.cl=id=>$("#"+id).classList.remove("on");const op=id=>$("#"+id).classList.add("on");
$("#yr").textContent=new Date().getFullYear();

/* ضغط الصور قبل الرفع */
const shrink=(file,max,q)=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",q))};i.src=u});

/* بيانات عامة */
onSnapshot(collection(db,"products"),s=>{PR=s.docs.map(d=>({id:d.id,...d.data()}));setP();draw();cartBtn();openHash();if(admin)adminDraw()});
onSnapshot(doc(db,"settings","store"),s=>{S=s.data()||{};draw();$("#sn").textContent=S.name||"متجر العدد الصناعية";$(".hero").style.backgroundImage=S.cover?`linear-gradient(rgba(31,35,38,.55),rgba(31,35,38,.92)),url("${S.cover}")`:"";
 $("#pay").textContent=S.payment||"—";$("#del").textContent=(S.delivery||"—")+(S.fee?`\nرسوم التوصيل: ${m(S.fee)}`:"");$("#ct").textContent=S.contact||"—";$("#pol").innerHTML=(S.about||S.policy)?`<details class="box" style="margin-top:14px"><summary><b>من نحن والسياسات</b></summary>${e(S.about)}\n\n${e(S.policy)}</details>`:"";
 $("#oz").innerHTML=(S.zones||"").split("\n").map(l=>l.split("=")[0].trim()).filter(Boolean).map(x=>`<option>${e(x)}</option>`).join(""); $("#opay").innerHTML=(S.payment||"نقداً").split("\n").filter(Boolean).map(x=>`<option>${e(x)}</option>`).join("")});const setP=()=>{P=PR.filter(p=>admin||!p.hidden)}; 

let C="";
const card=p=>`<article class="card"><button class="imgb" onclick="show('${p.id}')" aria-label="تفاصيل ${e(p.name)}">${p.img?`<img src="${p.img}" alt="${e(p.name)}" loading="lazy">`:'<span class="ph"></span>'}${p.stock<=0?'<span class="bd r">نفد</span>':p.old>p.price?`<span class="bd">خصم ${Math.round((1-p.price/p.old)*100)}%</span>`:p.stock<=3?'<span class="bd">كمية محدودة</span>':""}</button><div><span class="tag">${e(p.brand)} ${e(p.category)}</span><h3>${e(p.name)}</h3><span class="price">${m(p.price)}${p.old>p.price?` <s class="tag">${m(p.old)}</s>`:""}</span>
 <div class="row" style="padding:0;flex-direction:row;flex:none;margin-top:auto">${p.stock>0?`<button onclick="order('${p.id}')">أضف للسلة</button>`:""}<button class="g" onclick="show('${p.id}')">التفاصيل</button></div></div></article>`;
function draw(){const bv=$("#brand").value,bs=[...new Set(P.map(p=>p.brand).filter(Boolean))];$("#brand").innerHTML='<option value="">كل الماركات</option>'+bs.map(x=>`<option ${x==bv?"selected":""}>${e(x)}</option>`).join("");
 const q=$("#q").value.trim().toLowerCase(),cats=[...new Set(P.map(p=>p.category).filter(Boolean))];
 if(C&&!cats.includes(C))C="";
 $("#cl").innerHTML=cats.map(x=>`<option value="${e(x)}">`).join("");
 $("#chips").innerHTML=[["","الكل",P.length],...cats.map(x=>[x,x,P.filter(p=>p.category==x).length])].map(([v,n,k])=>`<button class="chip ${v==C?"on":""}" data-v="${e(v)}" onclick="setC(this.dataset.v)">${e(n)} <small>${k}</small></button>`).join("");
 const L=P.filter(p=>(!C||p.category==C)&&(!$("#brand").value||p.brand==$("#brand").value)&&(!q||(p.name+" "+(p.desc||"")).toLowerCase().includes(q))),o=$("#sort").value;
 L.sort(o=="lo"?(a,b)=>a.price-b.price:o=="hi"?(a,b)=>b.price-a.price:(a,b)=>(b.stock>0)-(a.stock>0));
 const F=P.filter(p=>p.featured&&p.stock>0);
 $("#ft").classList.toggle("hide",!!(q||C)||!F.length);$("#fg").innerHTML=F.map(card).join("");
 $("#cnt").textContent=L.length+" منتج";
 $("#stat").innerHTML=`<span><b>${P.length}</b>منتج</span><span><b>${cats.length}</b>تصنيف</span><span><b>${P.filter(p=>p.stock>0).length}</b>متوفر الآن</span>`+(S.delivery?"<span><b>✓</b>توصيل متوفر</span>":"");
 $("#grid").innerHTML=L.length?L.map(card).join(""):`<div class="empty">${P.length?"لا توجد منتجات مطابقة لبحثك.":"سيتم عرض المنتجات هنا قريباً."}</div>`;
}
window.setC=v=>{C=v;draw()};
window.show=id=>{const p=P.find(x=>x.id==id);if(!p)return;const im=p.imgs?.length?p.imgs:p.img?[p.img]:[];
 $("#md").innerHTML=(im.length?`<img id="big" src="${im[0]}" alt="${e(p.name)}">`+(im.length>1?`<div class="row">${im.map(x=>`<img src="${x}" style="height:54px;cursor:pointer" onclick="document.getElementById('big').src=this.src" alt="">`).join("")}</div>`:""):"")+`<span class="tag">${e(p.brand)} ${e(p.category)}</span><h2>${e(p.name)}</h2><p style="margin:0;white-space:pre-line">${e(p.desc)||"—"}</p>`+(p.specs?`<div class="box" style="padding:8px 12px">${e(p.specs)}</div>`:"")+`<span class="price">${m(p.price)}${p.old>p.price?` <s class="tag">${m(p.old)}</s>`:""}</span>${p.stock>0?`<span class="in">متوفر (${p.stock})</span>`:'<span class="out">نفد المخزون</span>'}
 <div class="row">${p.stock>0?`<button onclick="cl('mdm');order('${p.id}')">أضف للسلة</button>`:""}<button class="g" onclick="cp('${p.id}')">نسخ الرابط</button><button class="g" onclick="cl('mdm')">إغلاق</button></div>`;
 document.title=p.name+" | "+(S.name||"المتجر");history.replaceState(null,"","#p-"+p.id);op("mdm")};
window.cp=id=>{navigator.clipboard.writeText(location.origin+location.pathname+"#p-"+id);toast("تم نسخ الرابط")};
let oh=0;const openHash=()=>{const id=location.hash.slice(3);if(!oh&&location.hash.startsWith("#p-")&&P.find(x=>x.id==id)){oh=1;show(id)}};
$("#q").oninput=draw;$("#brand").onchange=draw;

/* طلب شراء */
let K={};try{K=JSON.parse(localStorage.getItem("k")||"{}")}catch{}
const sv=()=>{try{localStorage.setItem("k",JSON.stringify(K))}catch{}};
const items=()=>Object.entries(K).map(([id,q])=>({p:P.find(x=>x.id==id),q})).filter(x=>x.p&&x.p.stock>0).map(x=>({p:x.p,q:Math.min(x.q,x.p.stock)}));
const sub=()=>items().reduce((a,x)=>a+x.p.price*x.q,0);
const cartBtn=()=>{const n=items().reduce((a,x)=>a+x.q,0);$("#fc").classList.toggle("hide",!n);$("#fn").textContent=n};
